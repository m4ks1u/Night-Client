[package]
name = "night-client"
description = "Night Client desktop launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "night_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
nc-core.workspace = true
nc-launcher.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
nc-store.workspace = true

# Already in the tree through Tauri/wry; used directly for the WebView2
# memory-usage target. Keep in step with wry's versions.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"

[lints]
workspace = true
