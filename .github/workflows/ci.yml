name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the desktop end-to-end tests (debug build, real WebView2)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (needed by tauri-build)
        run: pnpm --filter @night-client/desktop build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    name: Frontend (typecheck, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm audit

  e2e:
    name: Desktop end-to-end (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @night-client/desktop build
      - run: cargo build -p night-client --locked
      # Debug builds load the UI from the Vite dev server.
      - name: Start Vite
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Start-Process -FilePath pnpm.cmd -ArgumentList dev -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest http://localhost:1420 -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
      # Throwaway data folders, so the runner's profile is never touched.
      # (ui-smoke needs an installed game and is run locally instead.)
      # The other scripts make their own throwaway folders; mod-plans calls the
      # real Modrinth API.
      - name: Accessibility, relocation, welcome, crash reports, density, mod plans
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "appdata"; $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "localappdata"
          foreach ($s in "a11y-audit", "relocate", "welcome", "crash-report", "density", "mod-plans") {
            node "e2e/$s.mjs" ../../target/debug/night-client.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
